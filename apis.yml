  - type: Capability
    url: capabilities/ambient-monitoring.yaml
- name: Brightlayer Demand Response Service API
  description: >
    RESTful, HTTP-based API for utilities running Eaton Demand Response Management System (DRMS) programs.
    Exposes secure operations to interact with, schedule, and curtail Eaton Cellular and Wi-Fi load-control
    switches deployed at the consumer edge (AC, water heater, irrigation, large motor loads). Targets
    DRMS platform integrations and program-administrator workflows including enrollment, asset management,
    event dispatch, and post-event measurement & validation.
  humanURL: >-
    https://www.eaton.com/us/en-us/digital/brightlayer/brightlayer-utilities-suite/Demand-response-management-software.html
  tags:
  - Demand Response
  - Utility
  - Grid
  - Load Control
  - DRMS
  - DR Events
  properties:
