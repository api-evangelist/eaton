- name: Eaton Rack PDU G4 REST API
  description: >
    RESTful API exposed by the Network Management Card (NMC) of Eaton's Rack PDU G4 (formerly Tripp Lite).
    Lets DCIM systems and IT operators provision outlets, query environmental sensors, schedule power
    cycling, and pull telemetry. NMC also speaks SNMPv3 and Modbus TCP for legacy integrations.
  humanURL: https://knowledgehub.eaton.com/s/article/API-documentation-for-G4-PDUs
  tags:
  - PDU
  - Rack
  - DCIM
  - NMC
  - Outlet Control
  - Telemetry
