- name: Eaton EV Smart Breaker Charger API
  description: >
    Subset of the Smart Breaker API surface scoped to Level-2 Green Motion EV charger devices (`hardwareType:
    ev-emcb`). Adds session-management, charge-control, and EV-specific telemetry on top of the shared
    device/location model. Operations tagged "EV Only" in the OpenAPI are gated to ev-emcb devices.
  humanURL: https://api.em.eaton.com/docs
  baseURL: https://api.em.eaton.com
  tags:
  - EV Charging
  - Level 2
  - Green Motion
  - Charge Sessions
  - Energy Management
