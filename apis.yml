- name: Brightlayer Digital Energy Twin (Autodesk)
  description: >
    AI-powered digital energy twin co-developed with Autodesk that integrates Eaton's Brightlayer energy
    software with Autodesk Tandem to simulate, monitor, and optimize energy use, electrical system performance,
    and infrastructure-upgrade impact across commercial buildings and data centers. Exposes the modelled
    facility as a programmatic asset twin for predictive maintenance and energy management.
  humanURL: >-
    https://www.eaton.com/us/en-us/company/news-insights/news-releases/2025/eaton-collaborates-with-autodesk-to-accelerate-building-digitalization.html
  tags:
  - Digital Twin
  - Energy Twin
  - AI
  - Building Lifecycle
  - Autodesk Tandem
  - Predictive Maintenance
  properties:
  - type: PressRelease
    url: >-
      https://www.eaton.com/us/en-us/company/news-insights/news-releases/2025/eaton-collaborates-with-autodesk-to-accelerate-building-digitalization.html
  - type: ProductPage
    url: https://www.eaton.com/us/en-us/digital/brightlayer.html
- name: Eaton Beam Rubin DSX Platform
  description: >
    Eaton + NVIDIA reference architecture announced March 2026 for end-to-end AI-factory deployment on
    NVIDIA's Vera Rubin platform. Bundles supercapacitor-backed power, busbar power distribution, hot-aisle
    containment, and DC connectors with 800 VDC architecture, scaling from megawatts to hundreds of megawatts.
    Not a public REST API today, but a strategic digital/physical product surface that ties Brightlayer
    telemetry to AI-factory orchestration.
  humanURL: >-
    https://www.eaton.com/us/en-us/company/news-insights/news-releases/2026/eaton-collaborates-with-nvidia-to-unveil-its-beam-rubin-dsx-platform.html
  tags:
