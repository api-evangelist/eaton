- name: Brightlayer UI (Design System)
  description: >
    Eaton's open-source design system and component library used to build Brightlayer applications. Ships
    themes, icons, progress icons, symbols, workflows, Storybook addons, and CLI templates for React,
    Angular, and React Native. Most package repos were consolidated into a monorepo in 2024; the public
    documentation site remains at brightlayer-ui.github.io.
  humanURL: https://brightlayer-ui.github.io/
  baseURL: https://www.npmjs.com/org/brightlayer-ui
