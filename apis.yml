- name: Brightlayer Operations Insight APIs
  description: >
    Family of REST APIs that let partners and customers extend the monitoring capabilities of Eaton power
    infrastructure (UPS, PDU, transfer switches, breakers, meters) into their own applications via the
    Brightlayer monitoring & management service. Surfaced through the Eaton API Specification Catalog
    on the developer-partners portal.
