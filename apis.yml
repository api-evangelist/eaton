- name: Eaton Smart Ambient Monitoring API
  description: >
    Healthcare-targeted subscription API that derives an "Activities of Daily Living" signal for residents
    of long-term care, assisted-living, and remote-care environments by applying proprietary ML/AI to
    the energy-usage signatures of household appliances behind an Eaton smart circuit breaker. Distributed
    via the Brightlayer Experience Hub on a subscription basis to owners/users of Eaton smart breakers.
  humanURL: https://www.eaton.com/us/en-us/digital/marketplace/smart-ambient-monitoring-api.html
  baseURL: https://api.em.eaton.com
  tags:
  - Healthcare
  - Ambient Monitoring
  - Activities Of Daily Living
  - AI
  - Machine Learning
  - Caregiving
  properties:
  - type: Marketplace
    url: https://www.eaton.com/us/en-us/digital/marketplace/smart-ambient-monitoring-api.html
  - type: PressRelease
    url: >-
      https://www.eaton.com/us/en-us/company/news-insights/news-releases/2023/eaton-launches-smart-ambient-monitoring-api.html
  - type: UseCases
